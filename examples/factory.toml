# Review for the one trusted target before submitting work.
repo = "mcnewcp/orch-sandbox"
checkout = "/workspace/target"
workspace_root = "/workspace"
# Match FACTORY_WORKSPACE in .env so status prints host-editable document paths.
host_workspace_root = "/home/operator/factory-workspace"
base_branch = "main"
agent = "codex"
auth = "subscription"
stage_timeout = 1200
ci_timeout = 600
poll_seconds = 3

# Exact GitHub check-run names required on the accepted candidate SHA.
required_ci = ["test"]

# Include every verification entry point/dependency file for this target.
# Instructions, REVIEW.md, factory.toml, and .github/** are always protected too.
protected_paths = ["pyproject.toml", "uv.lock", "requirements*.txt", "scripts/check*"]

[[checks]]
name = "tests"
command = ["python", "-m", "pytest", "-q"]
timeout = 300
