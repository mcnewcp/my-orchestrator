# Default orchestrator config. Override with `--config <path>` or $ORCH_CONFIG.

[roles]
contractor = "claude"
implementer = "claude"
auditor = "claude"
reviewer = "codex"
judge = "codex"
remediator = "claude"

[policy]
review_round_cap = 2
audit_failure_cap = 3
max_steps = 40

[runners.claude]
model = "opus"                       # "" -> let the harness pick
extra_args = []                      # appended verbatim

[runners.codex]
model = ""                           # "" -> user's ~/.codex/config.toml model
sandbox = "danger-full-access"
extra_args = []
