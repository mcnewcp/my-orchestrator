[project]
name = "orch"
version = "0.1.0"
description = "Issue -> PR orchestrator: a thin, stateless state-machine runner over role skills."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orch = "orch.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
