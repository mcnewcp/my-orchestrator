[project]
name = "software-factory"
version = "0.0.1"
description = "Factory v0: one bounded GitHub issue in, one PR ready for human review out, via headless Claude Code or Codex."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []  # stdlib only at runtime, by design (docs/design/prototype-v0.md §5)

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
